[package]
name = "lattice"
version = "0.1.0"
edition = "2021"

[dependencies]
# El cliente del daemon es de lspd, no de lattice: hay más de un consumidor.
#
# Va por path y no por git como `stratum` porque el repo de lspd todavía no está
# publicado. El día que lo esté, esta línea pasa a ser
# `{ git = "https://github.com/anibalanto/lspd.git", branch = "main" }` y el path
# —que ata dos repos independientes por cómo están acomodados en el disco— se va.
lspd-client = { path = "../../../../../lspd/.stratum/impl/crates/lspd-client" }
anyhow      = "1"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

[dev-dependencies]
tempfile = "3"
