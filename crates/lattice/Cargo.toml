[package]
name = "lattice"
version = "0.1.0"
edition = "2021"

[dependencies]
# El cliente del daemon es de lspd, no de lattice: hay más de un consumidor.
lspd-client = { git = "https://github.com/anibalanto/lspd.git", branch = "main" }
anyhow      = "1"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

[dev-dependencies]
tempfile = "3"
